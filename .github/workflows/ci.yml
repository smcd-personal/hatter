name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the system bash 3.2 - the one hatter has to work on.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Syntax
        run: /bin/bash -n bin/hatter

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck --severity=error bin/hatter file-issues.sh tools/install-termux.sh

      - name: Help runs with no config and no cmux
        run: |
          HOME="$(mktemp -d)"; export HOME
          /bin/bash bin/hatter --help >/dev/null
          /bin/bash bin/hatter help provision >/dev/null

      - name: Python tools compile
        run: python3 -m py_compile tools/*.py

  # The Android client: the real installer inside a real Termux userland,
  # which has no /tmp and a long TMPDIR. The hat it reaches is Termux's own
  # sshd in the same container, and a tmux session stands in for the phone's
  # terminal.
  termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install, attach and pick, inside Termux
        run: |
          mkdir -p "$RUNNER_TEMP/ci"
          cat > "$RUNNER_TEMP/ci/test.sh" <<'EOF'
          set -euo pipefail
          fail() { echo "FAIL: $*" >&2; exit 1; }
          [ ! -d /tmp ] || fail "this image has a /tmp, so the fallback is not tested"
          echo "TMPDIR=$TMPDIR"

          # The server half: Termux's sshd on 8022, with tmux.
          pkg install -y openssh tmux >/dev/null
          sshd
          mkdir -p ~/.ssh
          printf 'Host termux-ci\n  HostName 127.0.0.1\n  Port 8022\n' > ~/.ssh/config
          mkdir -p ~/.config/hatter
          echo '{"version":3,"hats":{"ci":{"ssh":"termux-ci","remote_dir":"$HOME"}},
                 "groups":{"CI":{"hat":"ci","sessions":{"ci-two":{}}}}}' > ~/.config/hatter/config.json

          # First run: a new key the hat does not accept yet.
          set +e
          out=$(bash /src/tools/install-termux.sh --non-interactive 2>&1); rc=$?
          set -e
          echo "$out"
          [ "$rc" -ne 0 ] || fail "first run passed with an unauthorised key"
          echo "$out" | grep -q "refuses this key" || fail "refused key not reported"
          echo "$out" | grep -q "hatter key add 'ssh-ed25519 " || fail "no key-add line"

          # What `hatter key add` does from another machine.
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys

          bash /src/tools/install-termux.sh --non-interactive
          out=$(bash /src/tools/install-termux.sh --non-interactive)
          echo "$out" | grep -q 'hatter is current' || fail "a re-run reinstalled hatter"

          command -v hatter
          hatter key add "$(cat ~/.ssh/id_ed25519.pub)" ci | grep -q present || fail "key add"
          ls -la "$TMPDIR"
          sock=$(find "$TMPDIR" -maxdepth 2 -type s | head -1)
          [ -n "$sock" ] || fail "no ssh control socket under TMPDIR"
          echo "control socket: $sock (${#sock} chars)"

          grep -q "extra-keys" ~/.termux/termux.properties || fail "no extra-keys row"
          [ -f ~/.shortcuts/hatter/ci ] && [ -f ~/.shortcuts/hatter/"ci two" ] \
            || fail "shortcuts missing: $(ls ~/.shortcuts/hatter)"
          head -1 ~/.shortcuts/hatter/ci | grep -q "^#!$PREFIX/bin/bash" || fail "shortcut shebang"

          # attach, by name, from a terminal.
          tmux new-session -d -s phone1 -x 80 -y 24 "hatter attach ci-one; sleep 30"
          for i in $(seq 20); do tmux has-session -t =ci-one 2>/dev/null && break; sleep 1; done
          tmux has-session -t =ci-one || fail "hatter attach ci-one did not start it"

          # Bare hatter, with no cmux: the picker. ci-one is running and
          # ci-two is recorded, so ci has two workspaces and asks.
          tmux new-session -d -s phone2 -x 80 -y 24 "hatter; sleep 30"
          for i in $(seq 20); do
            tmux capture-pane -p -t phone2 | grep -q "workspace on 'ci'" && break; sleep 1
          done
          tmux capture-pane -p -t phone2
          tmux send-keys -t phone2 2 Enter
          for i in $(seq 20); do tmux has-session -t =ci-two 2>/dev/null && break; sleep 1; done
          tmux has-session -t =ci-two || fail "picking 2 did not attach ci-two"
          echo PASS
          EOF
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/ci:/ci:ro" \
              termux/termux-docker:x86_64 bash /ci/test.sh

  # The Windows client: run the real installer on a real Windows machine, then
  # prove the WezTerm config it wrote loads and the plugin works there.
  windows-installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: A throwaway config repo, and a hand-written WezTerm config
        shell: pwsh
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP 'cfg'
          New-Item -ItemType Directory $cfg | Out-Null
          @'
          {"version":3,
           "hats":{"ci":{"ssh":"ci@127.0.0.1","remote_dir":"$HOME"}},
           "groups":{"CI Group":{"hat":"ci","sessions":{"ci-one":{},"ci two":{}}}}}
          '@ | Set-Content (Join-Path $cfg 'config.json')
          git -C $cfg init -q -b main
          git -C $cfg -c user.email=ci@example.com -c user.name=ci add .
          git -C $cfg -c user.email=ci@example.com -c user.name=ci commit -qm config
          'return {}' | Set-Content "$env:USERPROFILE\.wezterm.lua"
          # An existing key outside ~/.ssh, with no .pub and the loose
          # permissions it inherits from its folder - as a copied-in key has.
          $keys = Join-Path $env:RUNNER_TEMP 'keys'
          New-Item -ItemType Directory $keys | Out-Null
          Start-Process -Wait -NoNewWindow ssh-keygen -ArgumentList "-q -t ed25519 -N `"`" -C ci-existing -f `"$keys\work_key`""
          Remove-Item "$keys\work_key.pub"
          icacls "$keys\work_key" /grant '*S-1-5-32-545:(R)' | Out-Null   # BUILTIN\Users

      - name: Install, under Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\tools\install-windows.ps1 -NonInteractive -NoLaunch `
              -ConfigRemote "$env:RUNNER_TEMP\cfg" `
              -KeyPath "$env:RUNNER_TEMP\keys\work_key" `
              -RepoUrl "$env:GITHUB_WORKSPACE" -Ref HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Run again, under PowerShell 7 - nothing to change
        shell: pwsh
        run: |
          $out = & .\tools\install-windows.ps1 -NonInteractive -NoLaunch `
              -RepoUrl "$env:GITHUB_WORKSPACE" -Ref HEAD *>&1 | Out-String
          $out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($out -notmatch 'wezterm\.lua is current') { throw 'second run rewrote .wezterm.lua' }
          if ($out -notmatch 'work_key \(chosen before') { throw 'second run did not reuse the chosen key' }

      - name: Results
        shell: pwsh
        run: |
          $w = Get-Content "$env:USERPROFILE\.wezterm.lua" -Raw
          if (-not $w.StartsWith("-- Written by hatter's install-windows.ps1.")) { throw 'not written by the installer' }
          if (-not (Get-ChildItem "$env:USERPROFILE\.wezterm.lua.bak-*")) { throw 'the old config was not backed up' }
          $key = "$env:RUNNER_TEMP\keys\work_key"
          if (Test-Path "$env:USERPROFILE\.ssh\id_ed25519") { throw 'generated a key despite -KeyPath' }
          $me = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          $who = @((Get-Acl $key).Access | ForEach-Object { "$($_.IdentityReference)" } | Sort-Object -Unique)
          "key ACL: $($who -join ', ')"
          # What Windows OpenSSH accepts: the owner, SYSTEM and Administrators.
          foreach ($w in $who) { if ($w -ne $me -and $w -notmatch '\\(SYSTEM|Administrators)$') { throw "key still readable by $w" } }
          $fp = ((ssh-keygen -l -f $key) -split ' ')[1]
          if ((ssh-add -l) -notmatch [regex]::Escape($fp)) { throw 'key not in the agent' }
          if ((Get-Service ssh-agent).Status -ne 'Running') { throw 'ssh-agent not running' }
          if ((git -C "$env:USERPROFILE\.config\hatter" config core.sshCommand) -notmatch 'OpenSSH/ssh.exe') { throw 'config repo not using system ssh' }

      - name: The plugin, inside WezTerm on Windows
        shell: pwsh
        run: |
          $plugin = ("$env:LOCALAPPDATA\hatter\src\plugin\init.lua" -replace '\\','/')
          @"
          local wezterm = require 'wezterm'
          local hatter = dofile '$plugin'
          local cfg = assert(hatter.read({}))
          for _, e in ipairs(hatter.entries(cfg)) do
            local a = hatter.ssh_args({}, cfg.hats[e.hat], e.session)
            wezterm.log_error('ENTRY ' .. e.group .. ' | ' .. a[1] .. ' ' .. a[3] .. ' ' .. a[4])
          end
          return {}
          "@ | Set-Content "$env:RUNNER_TEMP\t.lua"
          $out = & "$env:ProgramFiles\WezTerm\wezterm.exe" --config-file "$env:RUNNER_TEMP\t.lua" ls-fonts 2>&1 | Out-String
          $entries = @($out -split "`n" | Where-Object { $_ -match 'ENTRY' })
          $entries
          if ($entries.Count -ne 2) { $out; throw "expected 2 entries, got $($entries.Count)" }
          if ($out -notmatch [regex]::Escape("ssh ci@127.0.0.1 tmux new-session -A -s 'ci two' -c `"`$HOME`"")) { throw 'wrong ssh command' }
